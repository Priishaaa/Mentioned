<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="See whether ChatGPT, Gemini and Claude recommend your brand when shoppers ask what to buy." />
    <title>Mentioned: is AI recommending your brand?</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)" />
    <!-- Link previews (WhatsApp, Slack, LinkedIn, X). Once deployed, make og:image an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mentioned" />
    <meta property="og:title" content="Is AI recommending your brand?" />
    <meta property="og:description" content="See whether ChatGPT, Gemini and Claude name your brand when shoppers ask what to buy, and what to fix if they don't." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("mentioned-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
